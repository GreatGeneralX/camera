<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08090c" />
    <meta name="description" content="ブラウザだけで使えるシンプルなカメラ" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="style.css" />
    <title>無音カメラ</title>
  </head>
  <body>
    <main class="camera" aria-label="カメラ">
      <video id="preview" autoplay muted playsinline></video>
      <canvas id="canvas" hidden></canvas>
      <p id="message" class="message" role="status" hidden></p>
      <footer class="controls" hidden>
        <div class="modes" aria-label="撮影モード">
          <strong>写真</strong>
        </div>
        <div class="capture-row">
          <button id="gallery" class="thumb" aria-label="直前の写真を表示" disabled></button>
          <button id="shutter" class="shutter" aria-label="撮影する"><span></span></button>
          <button id="flip" class="flip-button" aria-label="前後のカメラを切り替える">↻</button>
        </div>
      </footer>
    </main>
    <dialog id="photo-dialog">
      <img id="captured-photo" alt="撮影した写真" />
      <div class="photo-actions">
        <button id="retake">戻る</button>
        <button id="save" class="save-button">保存</button>
      </div>
    </dialog>
    <script type="module" src="app.js"></script>
  </body>
</html>
