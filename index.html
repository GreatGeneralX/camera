<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08090c" />
    <meta name="description" content="ブラウザだけで使えるシンプルなカメラ" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="style.css" />
    <title>無音カメラ</title>
  </head>
  <body>
    <main class="camera" aria-label="カメラ">
      <video id="preview" autoplay muted playsinline></video>
      <canvas id="canvas" hidden></canvas>
      <section id="permission" class="overlay">
        <div class="intro">
          <p class="eyebrow">PRIVATE CAMERA</p>
          <h1>無音カメラ</h1>
          <p>音を出さずに、ブラウザ上で撮影します。</p>
          <button id="start" class="primary">カメラを開く</button>
          <p id="message" class="message" role="status"></p>
        </div>
      </section>
      <header class="topbar" hidden>
        <button id="flip" class="icon-button" aria-label="前後のカメラを切り替える">↻</button>
        <span id="camera-name">背面カメラ</span>
        <button id="close" class="icon-button" aria-label="カメラを閉じる">×</button>
      </header>
      <footer class="controls" hidden>
        <button id="gallery" class="thumb" aria-label="直前の写真を表示" disabled></button>
        <button id="shutter" class="shutter" aria-label="撮影する"><span></span></button>
        <span class="spacer" aria-hidden="true"></span>
      </footer>
    </main>
    <dialog id="photo-dialog">
      <img id="captured-photo" alt="撮影した写真" />
      <div class="photo-actions">
        <button id="retake">戻る</button>
        <button id="save" class="primary">保存</button>
      </div>
    </dialog>
    <script src="app.js"></script>
  </body>
</html>
